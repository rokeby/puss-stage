  <line x1="430" y1="90" x2="430" y2="190" class="cut"/><text x="440" y="112" class="s">live sleight cut</text>
  <line x1="430" y1="145" x2="760" y2="145" class="cam"/><text x="500" y="174" class="s">hold close: no zoom-back pulse</text>
  <line x1="760" y1="145" x2="1080" y2="145" class="cam"/><text x="760" y="125" class="s">after CST drop: through curtain plane</text>
  <circle cx="1080" cy="145" r="13" class="target"/><text x="1000" y="183" class="s">P03 live start pose</text>
  <text x="50" y="250" class="l">S3 → I3 — reach black, move unseen, then reveal I2-reference shadow light</text>
  <line x1="80" y1="305" x2="1120" y2="305" class="axis"/>

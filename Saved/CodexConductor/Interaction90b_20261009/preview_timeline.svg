  <line x1="310" y1="305" x2="690" y2="305" class="dark"/><text x="335" y="344" class="s">I3 camera moves in total darkness</text>
  <line x1="690" y1="305" x2="1020" y2="305" class="spot"/><text x="700" y="282" class="s">black clears as shadow spots rise</text>
  <circle cx="690" cy="305" r="10" class="target"/><text x="650" y="375" class="s">camera settled</text>
  <text x="50" y="445" class="l">Lighting cut census</text>
  <text x="50" y="478" class="s">I1–I5: cut−1 / cut / cut+1 · shadow spots + world/spawned lights + PP exposure + fog · explicit F17 fixes only</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#11151b"/>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e8edf4}.h{font-size:26px;font-weight:700}.l{font-size:18px}.s{font-size:14px;fill:#aeb9c7}.axis{stroke:#52606f;stroke-width:2}.cam{stroke:#57b8ff;stroke-width:18}.dark{stroke:#07090d;stroke-width:32}.spot{stroke:#ffcc66;stroke-width:18}.target{fill:#6ee7a8}.cut{stroke:#ff6b8a;stroke-width:3;stroke-dasharray:8 7}</style>
  <text x="50" y="45" class="h">Job 90b analytical timeline (not a render)</text>
  <text x="50" y="92" class="l">I2 — preserve move-in, remove pulse, cross curtain, land exactly on P03 start</text>
  <line x1="80" y1="145" x2="1120" y2="145" class="axis"/>

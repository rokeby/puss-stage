<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#17181c"/>
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; fill: #ece8df; }
    .small { font-size: 16px; fill: #bcb8ae; }
    .label { font-size: 18px; font-weight: 600; }
    .axis { stroke: #85868b; stroke-width: 2; stroke-dasharray: 7 7; }
    .side { fill: #a85e38; fill-opacity: .72; stroke: #f1a46e; stroke-width: 2; }
    .valance { fill: #6879a8; fill-opacity: .75; stroke: #aebcf0; stroke-width: 2; }
    .opening { fill: #07080a; stroke: #d6c995; stroke-width: 2; }
  </style>
  <text x="60" y="48" font-size="28" font-weight="700">Paper proscenium — collider-derived default placement</text>
  <text x="60" y="78" class="small">OFFLINE PREVIEW · bounding boxes only · not an Unreal read-back or rendered acceptance</text>

  <text x="60" y="125" font-size="22" font-weight="650">Front elevation (stage y / z)</text>
  <rect x="165" y="155" width="870" height="465" class="opening"/>
  <line x1="600" y1="145" x2="600" y2="630" class="axis"/>
  <line x1="120" y1="620" x2="1080" y2="620" class="axis"/>
  <!-- scale 0.35 px/cm; y center = 600; z=0 maps to 620 -->
  <rect x="169.15" y="242" width="124.6" height="378" class="side"/>
  <rect x="906.25" y="242" width="113.05" height="378" class="side"/>
  <rect x="164.6" y="154.5" width="870.8" height="140" class="valance"/>
  <text x="174" y="345" class="label">Side L</text>
  <text x="924" y="345" class="label">Side R</text>
  <text x="505" y="210" class="label">Valance</text>
  <text x="555" y="646" class="small">centre y=0</text>
  <text x="80" y="616" class="small">z=0 boards</text>
  <text x="169" y="682" class="small">visible opening: y −875…+875 cm; valance bottom z=930 cm</text>

  <text x="60" y="718" class="small">Defaults from StageFront_Colliders_v2 + validated FBX pivots. Hyper3D exact transforms remain an argument-file update.</text>
  <g transform="translate(850,665)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#ece8df" stroke-width="4"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ece8df" stroke-width="3"/>
    <line x1="100" y1="-7" x2="100" y2="7" stroke="#ece8df" stroke-width="3"/>
    <text x="15" y="25" class="small">≈ 286 cm</text>
  </g>
</svg>

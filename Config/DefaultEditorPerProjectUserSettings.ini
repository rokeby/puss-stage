; PussStage owns 8010; MHFat holds 8000. Two editors can run at once, but only
; on distinct ports - a shared port means the second editor gets no listener and
; scripts silently address the wrong project.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8010
ServerUrlPath=/mcp
bEnableToolSearch=True

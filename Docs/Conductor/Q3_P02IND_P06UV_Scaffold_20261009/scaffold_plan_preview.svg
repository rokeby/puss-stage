    <path d="M0 0L210 100M210 0L0 100M210 100L420 200M420 100L210 200M0 200L210 300M210 200L0 300M210 300L420 400M420 300L210 400" class="brace" fill="none"/>
    <circle cx="105" cy="120" r="10" class="lamp"/><circle cx="315" cy="220" r="10" class="lamp"/>
    <path d="M0 445H420" class="dim"/><text x="145" y="480" class="s">5.6 m — APPLY default</text>
    <text x="0" y="520" class="d">Front −X • width +Y • up +Z • floor-centre origin</text>
  </g>
  <g transform="translate(650 155)">
    <rect x="0" y="0" width="450" height="400" class="net"/>
    <path d="M0 0V400M150 0V400M300 0V400M450 0V400M0 0H450M0 100H450M0 200H450M0 300H450M0 400H450" class="steel" fill="none"/>
    <path d="M0 0L150 100M150 0L0 100M150 100L300 200M300 100L150 200M300 200L450 300M450 200L300 300" class="brace" fill="none"/>
    <circle cx="75" cy="120" r="10" class="lamp"/><circle cx="225" cy="220" r="10" class="lamp"/><circle cx="375" cy="320" r="10" class="lamp"/>
    <path d="M0 445H450" class="dim"/><text x="105" y="480" class="s">8.4 m — explicit oversize only</text>
    <text x="0" y="520" class="d">12 source point lights excluded; Rig owns real lights.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#111820"/>
  <style>text{font-family:Segoe UI,Arial;fill:#e9eef3}.h{font-size:30px;font-weight:700}.s{font-size:18px}.d{font-size:15px;fill:#9fb1c3}.steel{stroke:#9aa7b2;stroke-width:12}.brace{stroke:#667887;stroke-width:7}.net{fill:#547080;fill-opacity:.30;stroke:#7793a3;stroke-dasharray:8 8}.lamp{fill:#ff9d42;stroke:#ffd098;stroke-width:3}.dim{stroke:#f0c674;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f0c674"/></marker></defs>
  <text x="55" y="55" class="h">P06 real scaffold — dormant export/placement plan</text>
  <text x="55" y="88" class="d">Measured source: 3 bays × 4 lifts, 8.4 m × 1.5 m × 10 m. Default placement: 2 bays / 5.6 m.</text>
  <g transform="translate(100 155)">
